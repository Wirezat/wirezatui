<!doctype html><html><head>
<link rel="stylesheet" href="../tokens/base.css">
<link rel="stylesheet" href="../components/tabs.css">
<link rel="stylesheet" href="../components/badges.css">
<style>body{background:var(--bg);color:var(--text);padding:24px;font-family:sans-serif}</style>
</head><body>
  <h3>Standard</h3>
  <div data-tabs>
    <div class="wui-tabs">
      <button class="wui-tab active" data-tab="a">Übersicht</button>
      <button class="wui-tab" data-tab="b">Details</button>
      <button class="wui-tab" data-tab="c">Historie <span class="badge badge-accent">3</span></button>
    </div>
    <div data-tab-panel="a">Panel A</div>
    <div data-tab-panel="b" hidden>Panel B</div>
    <div data-tab-panel="c" hidden>Panel C</div>
  </div>

  <h3>Fill-Variante (Login/Register)</h3>
  <div data-tabs>
    <div class="wui-tabs fill">
      <button class="wui-tab active" data-tab="x">Anmelden</button>
      <button class="wui-tab" data-tab="y">Registrieren</button>
    </div>
    <div data-tab-panel="x">Login-Formular</div>
    <div data-tab-panel="y" hidden>Register-Formular</div>
  </div>

<script type="module">
  import { initTabs } from '../js/tabs.js'
  initTabs()
</script>
</body></html>
