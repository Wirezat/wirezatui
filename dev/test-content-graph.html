<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>test-content-graph</title>
<link rel="stylesheet" href="../index.css"></head>
<body>
<div id="host" style="height:300px;"></div>
<pre id="out"></pre>
<script type="module">
  import { render } from '../js/wui/content-types/graph.js'
  const log = []
  const { el } = render({
    nodes: [{ id: 'a', level: 0, title: 'Result' }, { id: 'b', level: 1, title: 'Iron' }],
    edges: [{ from: 'a', to: 'b' }],
  })
  document.getElementById('host').appendChild(el)
  log.push(['renders graph board', !!el.querySelector('.graph-board')])
  log.push(['renders 2 nodes', el.querySelectorAll('.graph-node').length === 2])
  document.getElementById('out').textContent = log.map(([n, ok]) => `${ok ? 'PASS' : 'FAIL'} ${n}`).join('\n')
  console.log(log.map(([n, ok]) => `${ok ? 'PASS' : 'FAIL'} ${n}`).join('\n'))
</script>
</body></html>
