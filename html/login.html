<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <!-- /static/ui/ must symlink to wirezatUI/; app provides /static/css/theme.css -->
  <link rel="stylesheet" href="/static/ui/index.css" />
  <link rel="stylesheet" href="/static/css/theme.css" />
  <script>
    (function(){
      const s = localStorage.getItem('theme');
      if (s === 'dark' || (!s && matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.classList.add('dark');
    })();
  </script>
</head>
<body class="app-shell">

  <header class="header">
    <div class="header-brand"></div>
    <div class="header-right">
      <div class="lang-menu" id="lang-menu">
        <button class="btn btn-ghost btn-sm" id="lang-btn">🌐</button>
        <div class="lang-dropdown">
          <button class="lang-option" data-lang="en">🇬🇧 English</button>
          <button class="lang-option" data-lang="de">🇩🇪 Deutsch</button>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm" id="theme-btn">🌙</button>
    </div>
  </header>

  <div class="auth-main">
  <!-- Auth card (logo + tabs + forms) -->
  <div class="auth-card">

    <div class="auth-header">
      <div class="auth-logo" id="auth-logo">⚙️</div>
      <div class="auth-title" id="auth-title">App</div>
      <div class="auth-sub"   id="auth-sub"></div>
    </div>

    <!-- Tab bar — hidden when mode is 'login' or 'register' -->
    <div class="auth-tabs" id="auth-tabs">
      <button class="auth-tab active" id="tab-login"    data-i18n="login.tab_login">Login</button>
      <button class="auth-tab"        id="tab-register" data-i18n="login.tab_register">Register</button>
    </div>

    <div class="auth-body">

      <!-- Login panel -->
      <div class="auth-panel active" id="panel-login">
        <div class="field">
          <label data-i18n="login.username">Username</label>
          <input class="input" type="text" id="login-username"
                 data-i18n-placeholder="login.username_placeholder"
                 autocomplete="username" />
        </div>
        <div class="field">
          <label data-i18n="login.password">Password</label>
          <input class="input" type="password" id="login-password"
                 placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="auth-footer">
          <span class="status-msg" id="status-login"></span>
          <button class="btn btn-primary" id="btn-login" data-i18n="login.submit">Sign in</button>
        </div>
      </div>

      <!-- Password-only panel (mode="password" — no username, no account) -->
      <div class="auth-panel" id="panel-password">
        <div class="field">
          <label data-i18n="login.password">Password</label>
          <input class="input" type="password" id="password-only"
                 placeholder="••••••••" autocomplete="current-password" />
        </div>
        <div class="auth-footer">
          <span class="status-msg" id="status-password"></span>
          <button class="btn btn-primary" id="btn-password" data-i18n="login.confirm">Confirm</button>
        </div>
      </div>

      <!-- Register panel -->
      <div class="auth-panel" id="panel-register">
        <div class="field">
          <label data-i18n="login.username">Username</label>
          <input class="input" type="text" id="reg-username"
                 data-i18n-placeholder="login.reg_username_placeholder"
                 autocomplete="username" />
        </div>
        <div class="field">
          <label data-i18n="login.password">Password</label>
          <div class="input-wrap">
            <input class="input" type="password" id="reg-password"
                   placeholder="••••••••" autocomplete="new-password" />
          </div>
        </div>
        <div class="field">
          <label data-i18n="login.confirm_password">Confirm password</label>
          <div class="input-wrap" id="reg-confirm-wrap">
            <input class="input" type="password" id="reg-confirm"
                   placeholder="••••••••" autocomplete="new-password" />
            <span class="input-indicator" id="reg-match-icon"></span>
          </div>
        </div>
        <div class="auth-footer">
          <span class="status-msg" id="status-reg"></span>
          <button class="btn btn-primary" id="btn-register" data-i18n="login.register_submit">Create account</button>
        </div>
      </div>

    </div>
  </div>
  </div><!-- .auth-main -->

<script type="module">
  /* App-specific: update i18n path, default name/logo/redirect */
  import { load, applyI18n, getLang, setLang, t } from '/static/js/i18n.js';
  import { initAuth } from '/static/ui/js/auth.js';

  await load(getLang());
  applyI18n();

  const sp = new URLSearchParams(window.location.search);
  initAuth({
    name:     sp.get('name')     || 'App',
    logo:     sp.get('logo')     || '⚙️',
    subtitle: sp.get('subtitle') || '',
    mode:     sp.get('mode')     || 'both',
    redirect: sp.get('redirect') || '/',
  }, { t, getLang, setLang });
</script>

</body>
</html>
